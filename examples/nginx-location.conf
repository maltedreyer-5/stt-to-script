#
# nginx location for STT to Script under a sub-path. Include it in the server
# block that terminates TLS, and set STT_TO_SCRIPT_ROOT_PATH=/stt-to-script.
# The proxy_* lines follow the Gradio guide for running behind nginx.

location /stt-to-script/ {
    proxy_pass http://127.0.0.1:7860/;
    proxy_buffering off;               # progress updates are streamed
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # $host has no port. Behind TLS on port 443 that is right; if the proxy listens
    # on another port, use $http_host in both lines, or download links lose the port.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Must be at least STT_TO_SCRIPT_MAX_FILE_MB, or uploads fail at the proxy.
    client_max_body_size 12m;
    # A job is one long request; allow at least STT_TO_SCRIPT_MAX_ESTIMATED_MINUTES
    # plus queue time. Gradio sends a heartbeat every 15 s on the event stream.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
