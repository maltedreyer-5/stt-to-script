#
# Runs exactly the commands that CONTRIBUTING.md defines as "checked".

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Language
        run: python scripts/check_language.py
      - name: Tests
        run: pytest
      - name: No run-time state in the repository
        run: python scripts/check_repo_state.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev,e2e]"
          playwright install --with-deps chromium
      - name: Browser tests
        env:
          STT_TO_SCRIPT_E2E: "1"
        run: pytest tests/e2e
      - name: No run-time state in the repository
        run: python scripts/check_repo_state.py
