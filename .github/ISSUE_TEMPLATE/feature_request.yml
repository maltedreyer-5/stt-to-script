name: Feature request
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do that the tool does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead today?
